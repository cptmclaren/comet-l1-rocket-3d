<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comet L1 Rocket — 3D</title>
<meta name="description" content="Interactive 3D model of the Comet Rocketry L1 rocket (AeroTech HP-H135W) with every internal component, built from the OpenRocket design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0b0f17; --bg1:#121a27; --panel:rgba(16,22,33,.86); --panel-solid:#101621; --line:rgba(255,255,255,.08);
    --text:#e7ecf3; --muted:#93a0b4; --accent:#ff8a3d; --accent2:#5fb3ff; --good:#46c37b; --chip:#1b2433;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 70% 30%,#16233a 0%,var(--bg0) 60%) fixed;color:var(--text);font-family:Inter,system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block;outline:none}
  .panel{position:absolute;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #side{top:12px;left:12px;bottom:12px;width:330px;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
  #side.collapsed{transform:translateX(calc(-100% - 20px))}
  #side header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  #side h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px}
  #side .sub{font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
  .stat{background:var(--chip);border-radius:8px;padding:6px 8px}
  .stat b{display:block;font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
  .stat span{font-size:12px;font-weight:600}
  .scroll{overflow:auto;flex:1;padding:10px 12px 14px}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#2a3546;border-radius:8px}
  .ctl{margin:6px 0 12px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
  .ctl label output{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px;margin-bottom:6px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 12px Inter;padding:6px 4px;border-radius:7px;cursor:pointer}
  .seg button.on{background:#2a3850;color:var(--text)}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .tg{display:flex;align-items:center;gap:7px;background:var(--chip);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer;user-select:none}
  .tg input{accent-color:var(--accent);margin:0}
  h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px;font-weight:600}
  .grp{margin-bottom:6px}
  .grp-title{font-size:11px;color:var(--muted);margin:10px 4px 4px;display:flex;justify-content:space-between}
  .part{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .part:hover{background:#1c2636}
  .part.sel{background:#263450;box-shadow:inset 0 0 0 1px #3c5a8a}
  .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .part .m{margin-left:auto;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px}
  #info{right:12px;top:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;padding:16px 16px 14px;display:none}
  #info.show{display:block}
  #info h3{margin:0 26px 4px 0;font-size:16px}
  #info .mat{font-size:12px;color:var(--muted);margin-bottom:10px}
  #info .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:8px 0 12px;font-family:'JetBrains Mono',monospace}
  #info .kv b{color:var(--muted);font-weight:400;font-family:Inter}
  #info .sec{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);margin:12px 0 4px;font-weight:600}
  #info p{margin:0;font-size:13px;line-height:1.5;color:#d3dae5}
  #info .x{position:absolute;right:10px;top:10px;border:0;background:var(--chip);color:var(--text);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:15px}
  #views{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;padding:6px}
  #views button,#toggleSide{border:0;background:var(--chip);color:var(--text);font:500 12px Inter;padding:8px 10px;border-radius:8px;cursor:pointer}
  #views button:hover,#toggleSide:hover{background:#2a3850}
  #toggleSide{position:absolute;left:12px;bottom:12px;z-index:5;display:none}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);padding:7px 12px;white-space:nowrap}
  #tip{position:absolute;pointer-events:none;background:#0d131d;border:1px solid #2a3a54;color:var(--text);font-size:12px;padding:5px 8px;border-radius:7px;display:none;white-space:nowrap;z-index:10}
  .lbl{font:600 11px Inter;color:#fff;background:rgba(10,14,22,.78);border:1px solid rgba(255,255,255,.14);padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
  .lbl.cg{border-color:#bbb}.lbl.cp{border-color:#ff5b5b;color:#ffb3b3}
  .tick{font:500 10px 'JetBrains Mono',monospace;color:#9fb0c8;pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  @media (max-width:820px){
    #side{width:min(330px,calc(100% - 24px))}
    #side.collapsed + #toggleSide{display:block}
    #toggleSide{display:block}
    #info{left:12px;right:12px;width:auto;top:auto;bottom:64px;max-height:45%}
    #hint{display:none}
    #views{bottom:12px;right:12px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading rocket…</div>

<aside id="side" class="panel">
  <header>
    <h1 id="title">Comet L1 Rocket</h1>
    <div class="sub">Built from the OpenRocket design · every dimension to scale</div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="scroll">
    <h2>View</h2>
    <div class="ctl">
      <label>Airframe transparency <output id="opv">70%</output></label>
      <input id="opacity" type="range" min="0" max="100" value="70">
    </div>
    <div class="seg" id="mode"><button data-m="explode" class="on">Exploded</button><button data-m="eject">Ejection</button></div>
    <div class="ctl">
      <label><span id="slLbl">Explode sections</span> <output id="exv">0%</output></label>
      <input id="explode" type="range" min="0" max="100" value="0">
    </div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="cut"> Half-section cut</label>
      <label class="tg"><input type="checkbox" id="cgcp" checked> CG / CP</label>
      <label class="tg"><input type="checkbox" id="ruler" checked> Station ruler</label>
      <label class="tg"><input type="checkbox" id="isolate"> Isolate selected</label>
      <label class="tg"><input type="checkbox" id="spin"> Auto-rotate</label>
      <label class="tg"><input type="checkbox" id="units"> Show mm</label>
    </div>
    <h2>Components <span style="text-transform:none;letter-spacing:0;font-weight:400">— click to inspect</span></h2>
    <div id="list"></div>
  </div>
</aside>
<button id="toggleSide">☰ Parts</button>

<div id="info" class="panel"><button class="x" id="closeInfo" aria-label="Close">×</button><div id="infoBody"></div></div>
<div id="views" class="panel">
  <button data-v="iso">3D</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="aft">Aft</button><button data-v="fit">Fit</button>
</div>
<div id="hint" class="panel">Drag to orbit · Right-drag / two fingers to pan · Scroll / pinch to zoom · Click a part</div>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const R = await (await fetch('rocket.json', {cache: 'no-store'})).json();
document.getElementById('loading').remove();
const IN = 25.4, L = R.length, RO = R.r_out, RI = R.r_in;
const PART = Object.fromEntries(R.parts.map(p => [p.id, p]));

// ---------- renderer / scene ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
app.appendChild(renderer.domElement);
const labels = new CSS2DRenderer(); labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, {position: 'absolute', inset: '0', pointerEvents: 'none'});
app.appendChild(labels.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1d24, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(300, 900, 700); scene.add(sun);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 50000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.zoomToCursor = true;
controls.minDistance = 40; controls.maxDistance = 6000; controls.screenSpacePanning = true;

const world = new THREE.Group(); world.position.x = -L / 2; scene.add(world);   // nose tip at x=0, axis along +x

// ---------- helpers ----------
const SEG = 112;
function lathe(profile) {            // profile: [[r, x], ...] -> solid of revolution about the x-axis
  const g = new THREE.LatheGeometry(profile.map(([r, x]) => new THREE.Vector2(Math.max(r, 0), x)), SEG);
  g.rotateZ(-Math.PI / 2); g.computeVertexNormals(); return g;
}
const ring = (ri, ro, x0, x1) => lathe([[ri, x0], [ro, x0], [ro, x1], [ri, x1], [ri, x0]]);
const disk = (r, x0, x1) => lathe([[0, x0], [r, x0], [r, x1], [0, x1]]);
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({color, roughness: o.rough ?? 0.6, metalness: o.metal ?? 0.0, side: THREE.DoubleSide, transparent: true, opacity: 1, ...(o.extra || {})});
}
function tubeAlong(points, radius, color, o) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.2);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(24, points.length * 12), radius, 10, false), mat(color, o));
}
const metal = c => mat(c, {rough: 0.35, metal: 0.85});

// ---------- build parts ----------
const partGroups = {};      // id -> THREE.Group
const SKIN = new Set(['nose', 'upper', 'middle', 'lower']);
const CUTTABLE = new Set(['nose', 'upper', 'middle', 'lower', 'cpl1', 'cpl2', 'mmt', 'crF', 'crM', 'crA', 'bulkhead', 'retainer', 'motor']);
function add(id, ...meshes) {
  const g = partGroups[id] || (partGroups[id] = new THREE.Group());
  g.userData.id = id;
  meshes.forEach(m => { m.userData.id = id; m.material.userData.base = {color: m.material.color.clone(), opacity: m.material.opacity}; g.add(m); });
  world.add(g); return g;
}
const st = id => PART[id].st;
const col = id => PART[id].color;

// nose cone: Von Kármán + capped shoulder, shell 1.6 mm
{
  const N = R.nose.length, w = R.nose.wall, sh = R.nose.shoulder, pts = [];
  const vk = x => { const th = Math.acos(1 - 2 * x / N); return RO * Math.sqrt(th - Math.sin(2 * th) / 2) / Math.sqrt(Math.PI); };
  for (let i = 0; i <= 80; i++) { const x = N * (i / 80) ** 1.6; pts.push([vk(x), x]); }
  pts.push([RI, N], [RI, N + sh], [0, N + sh], [0, N + sh - w], [RI - w, N + sh - w], [RI - w, N]);
  for (let i = 80; i >= 2; i--) { const x = N * (i / 80) ** 1.6; pts.push([Math.max(vk(x) - w, 0), x]); }
  add('nose', new THREE.Mesh(lathe(pts), mat(col('nose'), {rough: 0.55})));
}
for (const id of ['upper', 'middle', 'lower']) add(id, new THREE.Mesh(ring(RI, RO, ...st(id)), mat(col(id), {rough: 0.75})));
for (const id of ['cpl1', 'cpl2']) add(id, new THREE.Mesh(ring(R.cpl_r_in, RI - 0.05, ...st(id)), mat(col(id), {rough: 0.8})));
add('mmt', new THREE.Mesh(ring(R.r_mmt_i, R.r_mmt_o, ...st('mmt')), mat(col('mmt'), {rough: 0.8})));
for (const id of ['crF', 'crM', 'crA']) add(id, new THREE.Mesh(ring(R.r_mmt_o, RI - 0.05, ...st(id)), mat(col(id), {rough: 0.7})));
add('bulkhead', new THREE.Mesh(disk(R.cpl_r_in - 0.05, ...st('bulkhead')), mat(col('bulkhead'), {rough: 0.7})));

// static ports: three dark plugs flush with the tube at 60/180/300 deg
{
  const x = st('ports')[0], g = [];
  for (const a of [60, 180, 300]) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 2.2, 20), mat('#05070a', {rough: 0.9}));
    const t = THREE.MathUtils.degToRad(a);
    m.position.set(x, Math.cos(t) * (RO - 0.6), Math.sin(t) * (RO - 0.6));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, Math.cos(t), Math.sin(t)));
    g.push(m);
  }
  add('ports', ...g);
}

// avionics sled with boards, battery, switch and two threaded rods to the bulkhead
{
  const [x0, x1] = st('avionics'), cx = (x0 + x1) / 2, len = x1 - x0, y0 = -8;
  const box = (w, h, d, x, y, z, c, o) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, o)); m.position.set(x, y, z); return m; };
  const meshes = [
    box(len, 3, 64, cx, y0, 0, '#3d6fb6', {rough: 0.6}),                       // PLA sled
    box(51, 1.6, 28, x0 + 34, y0 + 2.4, -14, '#1f6b3a', {rough: 0.5}),         // ESP-32 dev board
    box(18, 3, 16, x0 + 30, y0 + 4.6, -14, '#a9b0b8', {rough: 0.3, metal: 0.8}), // ESP-32 module can
    box(15, 1.6, 11, x0 + 70, y0 + 2.4, -16, '#6b2fa3', {rough: 0.5}),         // BMP-280
    box(22, 1.6, 18, x0 + 70, y0 + 2.4, 12, '#1f4fa3', {rough: 0.5}),          // microSD module
    box(48.5, 17.5, 26.5, x0 + 34, y0 + 10.5, 16, '#222428', {rough: 0.45}),   // 9 V battery
    box(10, 6, 8, x1 - 10, y0 + 4.5, 22, '#d33', {rough: 0.4}),                 // switch
  ];
  const b = st('bulkhead')[0];
  for (const z of [-26, 26]) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, b + 8 - (x0 - 4), 14), metal('#9aa3ad'));
    r.rotation.z = Math.PI / 2; r.position.set((x0 - 4 + b + 8) / 2, y0 - 6, z); meshes.push(r);
  }
  add('avionics', ...meshes);
}

// ballast A: bolt through the bulkhead, spacer, washer stack
{
  const [a, b] = st('ballastA'), bh = st('bulkhead'), meshes = [];
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, bh[1] + 8 - (a - 6), 16), metal('#8f979f'));
  bolt.rotation.z = Math.PI / 2; bolt.position.set((a - 6 + bh[1] + 8) / 2, 0, 0); meshes.push(bolt);
  const n = Math.round((b - a) / 2.6);
  for (let i = 0; i < n; i++) meshes.push(new THREE.Mesh(ring(3.4, 18, a + i * (b - a) / n, a + (i + 1) * (b - a) / n - 0.3), metal('#7d8a99')));
  meshes.push(new THREE.Mesh(ring(3.4, 6, b, bh[0]), metal('#6c757e')));   // spacer
  add('ballastA', ...meshes);
}

// U-bolt through the bulkhead with nuts and quick link
{
  const [a, b] = st('ubolt'), bh = st('bulkhead'), r = 9, legEnd = b - r - 4, pts = [];
  pts.push([bh[0] - 6, 0, -r], [legEnd, 0, -r]);
  for (let i = 1; i < 12; i++) { const t = Math.PI * i / 12; pts.push([legEnd + Math.sin(t) * r, 0, -Math.cos(t) * r]); }
  pts.push([legEnd, 0, r], [bh[0] - 6, 0, r]);
  const meshes = [tubeAlong(pts, 2.4, col('ubolt'), {rough: 0.3, metal: 0.9})];
  for (const z of [-r, r]) { const nut = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, 4, 6), metal('#aab1b9')); nut.rotation.z = Math.PI / 2; nut.position.set(bh[0] - 3, 0, z); meshes.push(nut); }
  const ql = new THREE.Mesh(new THREE.TorusGeometry(5, 1.4, 10, 28), metal('#c3c9cf')); ql.position.set(legEnd + r + 3, 0, 0); ql.rotation.x = Math.PI / 2; meshes.push(ql);
  add('ubolt', ...meshes);
}
// swivel
{
  const [a, b] = st('swivel'), meshes = [];
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, b - a - 10, 16), metal(col('swivel'))); barrel.rotation.z = Math.PI / 2; barrel.position.set((a + b) / 2, 0, 0); meshes.push(barrel);
  for (const x of [a + 3, b - 3]) { const e = new THREE.Mesh(new THREE.TorusGeometry(3.6, 1.1, 8, 20), metal('#c3c9cf')); e.position.set(x, 0, 0); e.rotation.y = Math.PI / 2; meshes.push(e); }
  add('swivel', ...meshes);
}
// packed parachute (rolled canopy + shroud lines to the swivel)
{
  const [a, b] = st('chute'), meshes = [];
  const prof = []; for (let i = 0; i <= 16; i++) { const t = i / 16; const x = a + t * (b - a); const e = Math.min(t, 1 - t) * (b - a); prof.push([Math.min(33, 10 + e * 1.6), x]); }
  meshes.push(new THREE.Mesh(lathe([[0, a], ...prof, [0, b]]), mat(col('chute'), {rough: 0.85})));
  for (let k = 0; k < 8; k++) { const t = k / 8 * Math.PI * 2; meshes.push(tubeAlong([[a + 4, Math.cos(t) * 20, Math.sin(t) * 20], [a - 6, Math.cos(t) * 8, Math.sin(t) * 8], [st('swivel')[1] - 2, 0, 0]], 0.45, '#f4f4f4', {rough: 0.9})); }
  add('chute', ...meshes);
}
// Nomex blanket (folded pad)
{
  const [a, b] = st('nomex');
  const m = new THREE.Mesh(new THREE.BoxGeometry(b - a, 56, 56, 1, 1, 1), mat(col('nomex'), {rough: 0.9}));
  m.position.set((a + b) / 2, 0, 0); m.rotation.x = Math.PI / 4;
  add('nomex', m);
}
// shock cord: Z-folded bundle + runs to the U-bolt and to the I-hook
{
  const [a, b] = st('cord'), meshes = [], fold = [];
  const n = 9; for (let i = 0; i <= n; i++) { const x = a + 4 + (b - a - 8) * i / n; fold.push([x, (i % 2 ? 1 : -1) * 26, -6 + (i % 3) * 6]); }
  meshes.push(tubeAlong(fold, 3.2, col('cord'), {rough: 0.85}));
  const ub = st('ubolt'), ih = st('ihook');
  meshes.push(tubeAlong([[ub[1] - 3, 0, 0], [ub[1] + 8, 0, -30], [st('chute')[1], 0, -36], [a + 4, -26, -6]], 2.2, col('cord'), {rough: 0.85}));
  meshes.push(tubeAlong([[b - 4, 26, 0], [b + 15, 10, 30], [ih[0] - 10, 0, 18], [ih[0] + 4, 0, 0]], 2.2, col('cord'), {rough: 0.85}));
  add('cord', ...meshes);
}
// I-hook through the forward centering ring
{
  const [a, b] = st('ihook'), cr = st('crF'), meshes = [];
  const eye = new THREE.Mesh(new THREE.TorusGeometry(7, 2.2, 10, 28), metal(col('ihook'))); eye.position.set(a + 7, 0, 0); eye.rotation.x = Math.PI / 2; meshes.push(eye);
  const sh = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, cr[1] + 8 - (a + 13), 14), metal(col('ihook'))); sh.rotation.z = Math.PI / 2; sh.position.set((a + 13 + cr[1] + 8) / 2, 0, 0); meshes.push(sh);
  for (const x of [cr[0] - 2, cr[1] + 2]) { const nut = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 3.5, 6), metal('#aab1b9')); nut.rotation.z = Math.PI / 2; nut.position.set(x, 0, 0); meshes.push(nut); }
  add('ihook', ...meshes);
}
// ballast B: washers on two bolts through the forward centering ring
{
  const [a, b] = st('ballastB'), cr = st('crF'), meshes = [];
  for (const y of [24, -24]) {
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, cr[1] + 6 - (a - 5), 12), metal('#8f979f')); bolt.rotation.z = Math.PI / 2; bolt.position.set((a - 5 + cr[1] + 6) / 2, y, 0); meshes.push(bolt);
    const n = Math.round((b - a) / 2.6);
    for (let i = 0; i < n; i++) { const w = new THREE.Mesh(ring(2.8, 9, a + i * (b - a) / n, a + (i + 1) * (b - a) / n - 0.3), metal('#7d8a99')); w.position.y = y; meshes.push(w); }
  }
  add('ballastB', ...meshes);
}
// fins (+ tabs) and epoxy fillets
{
  const F = R.fins, le = L - F.root, finMeshes = [], fil = [];
  const shape = new THREE.Shape();
  shape.moveTo(le, RO); shape.lineTo(le + F.sweep, RO + F.span); shape.lineTo(le + F.sweep + F.tip, RO + F.span); shape.lineTo(L, RO);
  shape.lineTo(le + F.tab_off + F.tab_l, RO); shape.lineTo(le + F.tab_off + F.tab_l, R.r_mmt_o); shape.lineTo(le + F.tab_off, R.r_mmt_o);
  shape.lineTo(le + F.tab_off, RO); shape.lineTo(le, RO);
  const fg = new THREE.ExtrudeGeometry(shape, {depth: F.t - 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 3, curveSegments: 4});
  fg.translate(0, 0, -(F.t - 1.2) / 2);
  const fs = 5;   // fillet leg
  const tri = new THREE.Shape(); tri.moveTo(0, 0); tri.lineTo(fs, 0); tri.quadraticCurveTo(0.6, 0.6, 0, fs); tri.lineTo(0, 0);
  for (let k = 0; k < F.count; k++) {
    const ang = k * 2 * Math.PI / F.count;
    const m = new THREE.Mesh(fg, mat(col('fins'), {rough: 0.65})); m.rotation.x = ang; finMeshes.push(m);
    for (const side of [1, -1]) {
      const g = new THREE.ExtrudeGeometry(tri, {depth: F.root - 4, bevelEnabled: false});
      g.rotateY(Math.PI / 2);                       // extrude along +x
      if (side > 0) g.scale(1, 1, -1);
      g.translate(le + 2, RO - 0.4, side * F.t / 2);
      const fm = new THREE.Mesh(g, mat(col('fillets'), {rough: 0.35})); fm.rotation.x = ang; fil.push(fm);
    }
  }
  add('fins', ...finMeshes); add('fillets', ...fil);
}
// motor + retainer
{
  const [a, b] = st('motor'), rr = R.r_mmt_i - 0.3;
  const prof = [[0, a], [rr, a], [rr, b - 6], [rr - 3, b], [9, b], [6.5, b - 18], [5, b - 18], [5, b - 20], [0, b - 20]];
  const m = new THREE.Mesh(lathe(prof), mat(col('motor'), {rough: 0.4, metal: 0.4}));
  const band = new THREE.Mesh(ring(rr + 0.05, rr + 0.25, a + 60, a + 140), mat('#d24a2a', {rough: 0.6}));
  add('motor', m, band);
  const [c, d] = st('retainer');
  const rp = [[R.r_mmt_o - 0.2, c], [18, c], [18, d], [9.5, d], [9.5, d - 2.5], [R.r_mmt_o - 0.2, d - 2.5]];
  add('retainer', new THREE.Mesh(lathe(rp), mat(col('retainer'), {rough: 0.3, metal: 0.9})));
}
// rail buttons (bottom, 180 deg)
{
  const prof = [[0, 0], [4.85, 0], [4.85, -2], [4, -2], [4, -7.7], [4.85, -7.7], [4.85, -9.7], [0, -9.7]];
  for (const id of ['btnF', 'btnA']) {
    const g = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 32);
    const m = new THREE.Mesh(g, mat(col(id), {rough: 0.5})); m.position.set(st(id)[0], -RO, 0);
    add(id, m);
  }
}

// ---------- CG / CP markers ----------
const markers = new THREE.Group(); world.add(markers);
function cgBall(x, txt) {
  const g = new THREE.Group();
  for (let q = 0; q < 4; q++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 16, q * Math.PI / 2, Math.PI / 2), new THREE.MeshBasicMaterial({color: q % 2 ? 0x111111 : 0xffffff, depthTest: false, transparent: true}));
    m.renderOrder = 10; g.add(m);
  }
  g.position.set(x, 0, 0); markers.add(g);
  const div = document.createElement('div'); div.className = 'lbl cg'; div.textContent = txt;
  const l = new CSS2DObject(div); l.position.set(x, RO + 140, 0); markers.add(l);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, RO + 130, 0)]), new THREE.LineDashedMaterial({color: 0xbbbbbb, dashSize: 6, gapSize: 4, depthTest: false}));
  line.computeLineDistances(); line.renderOrder = 9; markers.add(line);
}
cgBall(R.cg_launch, `CG launch  ${(R.cg_launch / IN).toFixed(2)} in`);
{
  const g = new THREE.Group(); const x = R.cp;
  const m1 = new THREE.Mesh(new THREE.SphereGeometry(7.5, 24, 16), new THREE.MeshBasicMaterial({color: 0xff4444, depthTest: false, transparent: true})); m1.renderOrder = 10; g.add(m1);
  g.position.set(x, 0, 0); markers.add(g);
  const div = document.createElement('div'); div.className = 'lbl cp'; div.textContent = `CP  ${(x / IN).toFixed(2)} in`;
  const l = new CSS2DObject(div); l.position.set(x, RO + 110, 0); markers.add(l);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, RO + 100, 0)]), new THREE.LineDashedMaterial({color: 0xff6b6b, dashSize: 6, gapSize: 4, depthTest: false}));
  line.computeLineDistances(); line.renderOrder = 9; markers.add(line);
}
{ // burnout CG (smaller, grey)
  const x = R.cg_burnout, g = new THREE.Mesh(new THREE.SphereGeometry(4.5, 20, 14), new THREE.MeshBasicMaterial({color: 0x9aa4b2, depthTest: false, transparent: true}));
  g.renderOrder = 10; g.position.set(x, 0, 0); markers.add(g);
  const div = document.createElement('div'); div.className = 'lbl'; div.style.opacity = .8; div.textContent = `CG burnout ${(x / IN).toFixed(2)} in`;
  const l = new CSS2DObject(div); l.position.set(x, -RO - 95, 0); markers.add(l);
}

// ---------- station ruler ----------
const ruler = new THREE.Group(); world.add(ruler);
{
  const y = -RO - 45, pts = [];
  pts.push(new THREE.Vector3(0, y, 0), new THREE.Vector3(L, y, 0));
  for (let i = 0; i * IN <= L + 0.1; i++) { const x = i * IN, h = i % 6 === 0 ? 12 : 5; pts.push(new THREE.Vector3(x, y, 0), new THREE.Vector3(x, y - h, 0)); }
  ruler.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0x6f819c})));
  for (let i = 0; i * IN <= L + 0.1; i += 6) { const d = document.createElement('div'); d.className = 'tick'; d.textContent = `${i}"`; const o = new CSS2DObject(d); o.position.set(i * IN, y - 22, 0); ruler.add(o); }
  const d = document.createElement('div'); d.className = 'tick'; d.textContent = `${(L / IN).toFixed(2)}"`; const o = new CSS2DObject(d); o.position.set(L, y - 22, 0); ruler.add(o);
  for (const [x, t] of [[R.joints.upper_middle, 'separation joint'], [R.joints.middle_lower, 'access joint']]) {
    const dv = document.createElement('div'); dv.className = 'tick'; dv.style.color = '#ffb37a'; dv.textContent = t; const ob = new CSS2DObject(dv); ob.position.set(x, RO + 18, 0); ruler.add(ob);
  }
}

// ---------- explode / ejection ----------
const EXPLODE = {nose: [-260, 0], upper: [-170, 0], recovery: [-40, 150], middle: [0, 0], lower: [140, 0], motor: [380, 0]};
const EJECT = {nose: [-340, 0], upper: [-340, 0], recovery: [-170, 70], middle: [0, 0], lower: [0, 0], motor: [0, 0]};
let mode = 'explode', amount = 0, anim = null;
function applyOffsets() {
  const tbl = mode === 'explode' ? EXPLODE : EJECT;
  for (const [id, g] of Object.entries(partGroups)) {
    const [dx, dy] = tbl[PART[id].group] || [0, 0];
    g.position.set(dx * amount, dy * amount, 0);
  }
  markers.visible = document.getElementById('cgcp').checked && amount < 0.02;
}

// ---------- materials state (opacity / cut / isolate / highlight) ----------
const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
let selected = null, hovered = null;
function refreshMaterials() {
  const op = 1 - document.getElementById('opacity').value / 100;
  const cut = document.getElementById('cut').checked, iso = document.getElementById('isolate').checked;
  for (const [id, g] of Object.entries(partGroups)) {
    g.traverse(m => {
      if (!m.isMesh) return; const M = m.material, base = M.userData.base;
      let o = SKIN.has(id) ? Math.max(op, 0.06) : (id === 'cpl1' || id === 'cpl2') ? Math.min(1, op + 0.3) : 1;
      if (iso && selected && id !== selected) o = Math.min(o, 0.08);
      M.opacity = o; M.depthWrite = o > 0.6;
      M.clippingPlanes = cut && CUTTABLE.has(id) ? [clip] : null;
      const hl = id === selected ? 0.35 : id === hovered ? 0.18 : 0;
      M.emissive = new THREE.Color(hl ? (id === selected ? 0xff8a3d : 0x5fb3ff) : 0x000000); M.emissiveIntensity = hl ? hl : 0;
      M.needsUpdate = true;
    });
    if (SKIN.has(id)) g.children.forEach(m => m.renderOrder = 2);
  }
}

// ---------- UI ----------
const fmtLen = mm => document.getElementById('units').checked ? `${mm.toFixed(1)} mm` : `${(mm / IN).toFixed(3)} in`;
document.getElementById('title').textContent = R.name;
document.getElementById('stats').innerHTML = R.stats.map(([k, v]) => `<div class="stat"><b>${k}</b><span>${v}</span></div>`).join('');
const GROUPS = [['nose', 'Nose'], ['upper', 'Forward section (E-bay)'], ['recovery', 'Recovery (loose in the bay)'], ['middle', 'Middle tube'], ['lower', 'Fin can'], ['motor', 'Motor']];
function buildList() {
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const [gk, gname] of GROUPS) {
    const ps = R.parts.filter(p => p.group === gk); if (!ps.length) continue;
    const tot = ps.reduce((s, p) => s + (p.mass || 0), 0);
    const div = document.createElement('div'); div.className = 'grp';
    div.innerHTML = `<div class="grp-title"><span>${gname}</span><span>${tot.toFixed(0)} g</span></div>`;
    for (const p of ps) {
      const el = document.createElement('div'); el.className = 'part'; el.dataset.id = p.id;
      el.innerHTML = `<span class="dot" style="background:${p.color}"></span><span>${p.name}</span><span class="m">${p.mass ? p.mass.toFixed(0) + ' g' : ''}</span>`;
      el.onclick = () => select(p.id, true);
      el.onmouseenter = () => { hovered = p.id; refreshMaterials(); }; el.onmouseleave = () => { hovered = null; refreshMaterials(); };
      div.appendChild(el);
    }
    list.appendChild(div);
  }
}
buildList();
function showInfo(id) {
  const p = PART[id], box = document.getElementById('info');
  const [a, b] = p.st, len = b - a;
  box.querySelector('#infoBody').innerHTML = `
    <h3>${p.name}</h3><div class="mat">${p.material}</div>
    <div class="kv"><b>Station</b><span>${len > 0.5 ? `${fmtLen(a)} → ${fmtLen(b)}` : fmtLen(a)} from nose tip</span>
    ${len > 0.5 ? `<b>Length</b><span>${fmtLen(len)}</span>` : ''}
    ${p.mass ? `<b>Mass</b><span>${p.mass.toFixed(1)} g</span>` : ''}</div>
    <div class="sec">What it is</div><p>${p.what}</p>
    <div class="sec">Why it's there</div><p>${p.why}</p>
    <div class="sec">How it's mounted · load path</div><p>${p.how}</p>`;
  box.classList.add('show');
}
function select(id, fly) {
  selected = id;
  document.querySelectorAll('.part').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  if (id) { showInfo(id); if (fly) flyTo(id); document.querySelector(`.part[data-id="${id}"]`)?.scrollIntoView({block: 'nearest'}); }
  else document.getElementById('info').classList.remove('show');
  refreshMaterials();
}
document.getElementById('closeInfo').onclick = () => select(null);

// camera moves
let tween = null;
function moveCam(pos, target, ms = 700) {
  tween = {t0: performance.now(), ms, p0: camera.position.clone(), p1: pos, c0: controls.target.clone(), c1: target};
}
function boxOf(obj) { return new THREE.Box3().setFromObject(obj); }
function flyTo(id) {
  const b = boxOf(partGroups[id]), c = b.getCenter(new THREE.Vector3()), r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 45);
  const dir = camera.position.clone().sub(controls.target).normalize();
  moveCam(c.clone().add(dir.multiplyScalar(r * 3.2 + 60)), c);
}
function sideW() { const s = $('side'); return (innerWidth > 820 && !s.classList.contains('collapsed')) ? s.getBoundingClientRect().width + 24 : 0; }
function updateOffset() {
  const w = innerWidth, h = innerHeight, sw = sideW();
  if (sw) camera.setViewOffset(w + sw, h, 0, 0, w, h); else camera.clearViewOffset();
  camera.aspect = (w + sw) / h; camera.updateProjectionMatrix();
}
function fitDist(extra = 1.12) {      // distance that fits the rocket length into the visible width
  const visW = innerWidth - sideW(), aspect = visW / innerHeight;
  const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * aspect);
  return (L * extra / 2) / Math.tan(hf) + 60;
}
const ISO = new THREE.Vector3(-0.18, 0.36, 0.92).normalize();
function view(v) {
  const c = new THREE.Vector3(0, 0, 0), d = fitDist();
  if (v === 'aft') { moveCam(new THREE.Vector3(L / 2 + 520, 60, 0.001), new THREE.Vector3(L / 2 - 60, 0, 0)); return; }
  const dir = {iso: ISO, fit: ISO, side: new THREE.Vector3(0, 0, 1), top: new THREE.Vector3(0, 1, 0.001)}[v];
  moveCam(dir.clone().multiplyScalar(v === 'side' || v === 'top' ? d : d * 1.12), c);
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => view(b.dataset.v));

// controls wiring
const $ = id => document.getElementById(id);
$('opacity').oninput = e => { $('opv').textContent = e.target.value + '%'; refreshMaterials(); };
$('explode').oninput = e => { amount = e.target.value / 100; $('exv').textContent = e.target.value + '%'; applyOffsets(); };
$('mode').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.m;
  $('slLbl').textContent = mode === 'explode' ? 'Explode sections' : 'Separate at ejection';
  applyOffsets();
  if (amount === 0) { // play a short animation so the difference is obvious
    const start = performance.now(); anim = t => { const k = Math.min((t - start) / 1200, 1); amount = 0.5 - 0.5 * Math.cos(Math.PI * k); $('explode').value = Math.round(amount * 100); $('exv').textContent = $('explode').value + '%'; applyOffsets(); if (k >= 1) anim = null; };
  }
});
['cut', 'isolate'].forEach(id => $(id).onchange = refreshMaterials);
$('cgcp').onchange = applyOffsets;
$('ruler').onchange = e => ruler.visible = e.target.checked;
$('spin').onchange = e => controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 0.8;
$('units').onchange = () => { if (selected) showInfo(selected); };
$('toggleSide').onclick = () => { $('side').classList.toggle('collapsed'); setTimeout(updateOffset, 260); };
if (innerWidth < 820) $('side').classList.add('collapsed');

// picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('tip');
let downAt = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const op = 1 - $('opacity').value / 100, cut = $('cut').checked;
  const objs = Object.entries(partGroups).filter(([id]) => !(SKIN.has(id) && op < 0.5)).map(([, g]) => g);
  for (const h of ray.intersectObjects(objs, true)) {
    if (cut && CUTTABLE.has(h.object.userData.id) && clip.distanceToPoint(h.point) < 0) continue;
    return h.object.userData.id;
  }
  return null;
}
renderer.domElement.addEventListener('pointermove', ev => {
  const id = pick(ev);
  if (id !== hovered) { hovered = id; refreshMaterials(); }
  if (id) { tip.style.display = 'block'; tip.textContent = PART[id].name; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; renderer.domElement.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerdown', ev => downAt = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  select(pick(ev), false);
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; hovered = null; refreshMaterials(); });

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); updateOffset();
});

// start
refreshMaterials(); applyOffsets();
updateOffset(); camera.position.copy(ISO.clone().multiplyScalar(fitDist() * 1.12)); controls.target.set(0, 0, 0);
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
renderer.setAnimationLoop(t => {
  if (tween) {
    const k = Math.min((performance.now() - tween.t0) / tween.ms, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.c0, tween.c1, e);
    if (k >= 1) tween = null;
  }
  if (anim) anim(t);
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
});
</script>
</body>
