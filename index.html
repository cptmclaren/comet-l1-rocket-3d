<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comet L1 Rocket — 3D</title>
<meta name="description" content="Interactive 3D model of the Comet Rocketry L1 rocket (AeroTech H220T-14A) with every internal component, a step-by-step build mode and live part animations, built from the OpenRocket design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0b0f17; --bg1:#121a27; --panel:rgba(16,22,33,.86); --panel-solid:#101621; --line:rgba(255,255,255,.08);
    --text:#e7ecf3; --muted:#93a0b4; --accent:#ff8a3d; --accent2:#5fb3ff; --good:#46c37b; --chip:#1b2433;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 70% 30%,#16233a 0%,var(--bg0) 60%) fixed;color:var(--text);font-family:Inter,system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block;outline:none}
  .panel{position:absolute;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #side{top:12px;left:12px;bottom:12px;width:330px;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
  #side.collapsed{transform:translateX(calc(-100% - 20px))}
  #side header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  #side h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px}
  #side .sub{font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
  .stat{background:var(--chip);border-radius:8px;padding:6px 8px}
  .stat b{display:block;font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
  .stat span{font-size:12px;font-weight:600}
  .scroll{overflow:auto;flex:1;padding:10px 12px 14px}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#2a3546;border-radius:8px}
  .ctl{margin:6px 0 12px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
  .ctl label output{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px;margin-bottom:6px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 12px Inter;padding:6px 4px;border-radius:7px;cursor:pointer}
  .seg button.on{background:#2a3850;color:var(--text)}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .tg{display:flex;align-items:center;gap:7px;background:var(--chip);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer;user-select:none}
  .tg input{accent-color:var(--accent);margin:0}
  h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px;font-weight:600}
  .grp{margin-bottom:6px}
  .grp-title{font-size:11px;color:var(--muted);margin:10px 4px 4px;display:flex;justify-content:space-between}
  .part{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .part:hover{background:#1c2636}
  .part.sel{background:#263450;box-shadow:inset 0 0 0 1px #3c5a8a}
  .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .part .m{margin-left:auto;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px}
  #info{right:12px;top:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;padding:16px 16px 14px;display:none}
  #info.show{display:block}
  #info h3{margin:0 26px 4px 0;font-size:16px}
  #info .mat{font-size:12px;color:var(--muted);margin-bottom:10px}
  #info .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:8px 0 12px;font-family:'JetBrains Mono',monospace}
  #info .kv b{color:var(--muted);font-weight:400;font-family:Inter}
  #info .sec{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);margin:12px 0 4px;font-weight:600}
  #info p{margin:0;font-size:13px;line-height:1.5;color:#d3dae5}
  #info .x{position:absolute;right:10px;top:10px;border:0;background:var(--chip);color:var(--text);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:15px}
  #views{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;padding:6px}
  #views button,#toggleSide{border:0;background:var(--chip);color:var(--text);font:500 12px Inter;padding:8px 10px;border-radius:8px;cursor:pointer}
  #views button:hover,#toggleSide:hover{background:#2a3850}
  #toggleSide{position:absolute;left:12px;bottom:12px;z-index:5;display:none}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);padding:7px 12px;white-space:nowrap}
  #tip{position:absolute;pointer-events:none;background:#0d131d;border:1px solid #2a3a54;color:var(--text);font-size:12px;padding:5px 8px;border-radius:7px;display:none;white-space:nowrap;z-index:10}
  .lbl{font:600 11px Inter;color:#fff;background:rgba(10,14,22,.78);border:1px solid rgba(255,255,255,.14);padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
  .lbl.cg{border-color:#bbb}.lbl.cp{border-color:#ff5b5b;color:#ffb3b3}
  .tick{font:500 10px 'JetBrains Mono',monospace;color:#9fb0c8;pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}

  /* ---- build mode / live parts ---- */
  .bigbtn{width:100%;border:0;border-radius:10px;padding:10px 12px;margin:2px 0 12px;font:600 13px Inter;color:#1a1208;background:linear-gradient(135deg,#ffa35c,#ff7a2a);cursor:pointer;box-shadow:0 4px 16px rgba(255,122,42,.25)}
  .bigbtn:hover{filter:brightness(1.07)}
  body.building .bigbtn{background:var(--chip);color:var(--text);box-shadow:none}
  .seg.fx button{font-size:12px}
  .pill{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#1a1208;background:var(--accent);border-radius:5px;padding:1px 5px;margin-left:2px}
  .mk{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:var(--chip);border-radius:8px;padding:5px 9px;margin:0 0 8px}
  .mk i{width:10px;height:10px;border-radius:3px;background:var(--c)}
  .mknote{font-size:12.5px!important;color:var(--muted)!important;margin-bottom:6px!important}
  #build{display:none;left:366px;right:12px;bottom:66px;max-width:760px;padding:12px 14px 12px}
  body.building #build{display:block}
  body.building #hint{display:none}
  body.building #info{max-height:calc(100% - 24px - 300px)}
  #build .b-top{display:flex;align-items:center;gap:10px}
  #build .b-step{font:600 11px 'JetBrains Mono',monospace;color:#1a1208;background:var(--accent);border-radius:6px;padding:3px 7px;white-space:nowrap}
  #build h3{margin:0;font-size:15px;flex:1}
  #build .x2{border:0;background:var(--chip);color:var(--text);font:500 12px Inter;padding:6px 10px;border-radius:8px;cursor:pointer}
  #build .x2:hover{background:#2a3850}
  .b-dots{display:flex;gap:4px;margin:10px 0 8px}
  .b-dots button{flex:1;height:8px;border:0;border-radius:4px;background:#26324a;cursor:pointer;padding:0;transition:background .2s}
  .b-dots button.done{background:#3e5a86}
  .b-dots button.cur{background:var(--accent)}
  .b-dots button.pr{box-shadow:0 -3px 0 0 var(--accent)}
  .b-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:500 12px Inter;border-radius:8px;padding:5px 9px;cursor:pointer}
  .chip:hover{background:#243049}
  .chip i{width:10px;height:10px;border-radius:3px;flex:none}
  .chip b{font-size:10px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:#243049;color:var(--muted)}
  .chip.pr{border-color:rgba(255,138,61,.6)}
  .chip.pr b{background:var(--accent);color:#1a1208}
  #bText{margin:0 0 6px;font-size:13px;line-height:1.5;color:#d3dae5}
  .b-tip{font-size:12px;line-height:1.45;color:#ffd7b8;background:rgba(255,138,61,.09);border-left:3px solid var(--accent);border-radius:4px;padding:6px 9px;margin-bottom:8px}
  .b-tip:empty{display:none}
  .b-nav{display:flex;gap:8px;align-items:center}
  .b-nav button{border:0;background:var(--chip);color:var(--text);font:600 12px Inter;padding:8px 12px;border-radius:8px;cursor:pointer}
  .b-nav button:hover{background:#2a3850}
  .b-nav button.pri{background:var(--accent);color:#1a1208;margin-left:auto}
  .b-nav button.on{background:#2a3850;box-shadow:inset 0 0 0 1px var(--accent)}
  .b-nav button:disabled{opacity:.35;cursor:default}
  .b-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:11px;color:var(--muted)}
  .b-legend span{display:flex;align-items:center;gap:5px}
  .b-legend i{width:9px;height:9px;border-radius:3px}
  .lbl.prn{border-color:var(--accent);color:#ffd2b0;background:rgba(40,20,5,.85)}
  @media (max-width:820px){
    #build{left:12px;right:12px;bottom:62px;padding:10px 12px;max-height:44vh;overflow:auto}
    #build .b-legend,#build .b-tip{display:none}
    #bText{font-size:12px;line-height:1.45}
    .chip{padding:4px 7px;font-size:11px}
    body.building #info{top:12px;bottom:auto;max-height:32%}
  }
  @media (max-width:820px){
    #side{width:min(330px,calc(100% - 24px))}
    #side.collapsed + #toggleSide{display:block}
    #toggleSide{display:block}
    #info{left:12px;right:12px;width:auto;top:auto;bottom:64px;max-height:45%}
    #hint{display:none}
    #views{bottom:12px;right:12px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading rocket…</div>

<aside id="side" class="panel">
  <header>
    <h1 id="title">Comet L1 Rocket</h1>
    <div class="sub">Built from the OpenRocket design · every dimension to scale</div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="scroll">
    <button class="bigbtn" id="buildBtn">🔧 Build mode — see it assembled step by step</button>
    <h2>View</h2>
    <div class="ctl">
      <label>Airframe transparency <output id="opv">70%</output></label>
      <input id="opacity" type="range" min="0" max="100" value="70">
    </div>
    <div class="seg" id="mode"><button data-m="explode" class="on">Exploded</button><button data-m="eject">Ejection</button></div>
    <div class="ctl">
      <label><span id="slLbl">Explode sections</span> <output id="exv">0%</output></label>
      <input id="explode" type="range" min="0" max="100" value="0">
    </div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="cut"> Half-section cut</label>
      <label class="tg"><input type="checkbox" id="cgcp" checked> CG / CP</label>
      <label class="tg"><input type="checkbox" id="ruler" checked> Station ruler</label>
      <label class="tg"><input type="checkbox" id="isolate"> Isolate selected</label>
      <label class="tg"><input type="checkbox" id="spin"> Auto-rotate</label>
      <label class="tg"><input type="checkbox" id="units"> Show mm</label>
      <label class="tg"><input type="checkbox" id="live" checked> Live parts</label>
      <label class="tg"><input type="checkbox" id="tint"> Color by how made</label>
    </div>
    <div class="seg fx"><button id="fireBtn">🔥 Motor burn</button><button id="puffBtn">💨 Ejection charge</button></div>
    <h2>Components <span style="text-transform:none;letter-spacing:0;font-weight:400">— click to inspect</span></h2>
    <div id="list"></div>
  </div>
</aside>
<button id="toggleSide">☰ Parts</button>

<div id="info" class="panel"><button class="x" id="closeInfo" aria-label="Close">×</button><div id="infoBody"></div></div>
<div id="views" class="panel">
  <button data-v="iso">3D</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="aft">Aft</button><button data-v="fit">Fit</button>
</div>
<div id="build" class="panel">
  <div class="b-top"><span class="b-step" id="bStep">Step 1 / 1</span><h3 id="bTitle"></h3><button class="x2" id="bExit">Exit build</button></div>
  <div class="b-dots" id="bDots"></div>
  <div class="b-chips" id="bChips"></div>
  <p id="bText"></p>
  <div class="b-tip" id="bTip"></div>
  <div class="b-nav"><button id="bPrev">◀ Back</button><button id="bPlay">▶ Auto-play</button><button id="bNext" class="pri">Next step ▶</button></div>
  <div class="b-legend" id="legend"></div>
</div>
<div id="hint" class="panel">Drag to orbit · Right-drag / two fingers to pan · Scroll / pinch to zoom · Click a part</div>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const R = await (await fetch('rocket.json', {cache: 'no-store'})).json();
document.getElementById('loading').remove();
const IN = 25.4, L = R.length, RO = R.r_out, RI = R.r_in;
const PART = Object.fromEntries(R.parts.map(p => [p.id, p]));

// ---------- how each part is made (drives Build mode + colour coding) ----------
const MAKE = {
  print: {label: '3D printed', color: '#ff8a3d'},
  cut:   {label: 'Cut / drilled from stock — not printed', color: '#e8c26a'},
  buy:   {label: 'Bought hardware / supplies — not printed', color: '#5fb3ff'},
  epoxy: {label: 'Epoxy, applied by hand — not printed', color: '#b58cff'},
};
const MADE = {nose: 'print', avionics: 'print',
  upper: 'cut', middle: 'cut', lower: 'cut', cpl1: 'cut', cpl2: 'cut', mmt: 'cut', crF: 'cut', crM: 'cut', crA: 'cut', bulkhead: 'cut', fins: 'cut', ports: 'cut',
  ubolt: 'buy', swivel: 'buy', ihook: 'buy', retainer: 'buy', btnF: 'buy', btnA: 'buy', chute: 'buy', nomex: 'buy', cord: 'buy', motor: 'buy', ballastA: 'buy', ballastB: 'buy',
  fillets: 'epoxy'};
const inch = mm => (mm / IN).toFixed(mm / IN % 1 ? 2 : 0).replace(/\.?0+$/, '') + ' in';
const lenOf = id => PART[id].st[1] - PART[id].st[0];
function makeNote(id) {
  const k = MADE[id] || 'buy';
  const tube = `Cardboard tube cut to ${inch(lenOf(id))} (${lenOf(id).toFixed(0)} mm).`;
  return ({
    nose: 'Print in PLA/PLA+ with a 1.6 mm wall. The 85 mm shoulder has to be a snug fit in the upper tube, so sand or re-scale until it is.',
    avionics: 'Only the sled is printed (PLA). The ESP-32, BMP-280, microSD module, 9 V battery and switch are bought electronics.',
    upper: tube + ' Not printed.', middle: tube + ' Not printed.', lower: tube + ' Not printed. Three fin slots are cut through the wall.',
    cpl1: 'Cardboard coupler cut to ' + inch(lenOf('cpl1')) + '. Not printed.', cpl2: 'Cardboard coupler cut to ' + inch(lenOf('cpl2')) + '. Not printed.',
    mmt: 'Cardboard 29 mm motor-mount tube cut to 9½ in. Not printed.',
    crF: 'Birch plywood 1/8 in, cut to size. (The club rules also allow PLA/PLA+ for rings, but this design uses birch.)',
    crM: 'Birch plywood 1/8 in, cut to size. (Rules also allow PLA/PLA+.)', crA: 'Birch plywood 1/8 in, cut to size. (Rules also allow PLA/PLA+.)',
    bulkhead: 'Birch plywood 1/4 in disc, cut to size. (Rules also allow PLA/PLA+.)',
    fins: 'Cut from 3/16 in birch plywood, tabs included, edges rounded. (Rules also allow PLA/PLA+ fins; these are not printed.)',
    ports: 'Three 1/8 in holes drilled through the tube wall.',
    fillets: 'Mixed epoxy, applied and shaped by hand after the fins are tacked in.',
    chute: 'Bought / club-supplied ripstop-nylon parachute.', nomex: 'Bought / club-supplied Nomex blanket.', cord: 'Bought 12-strand Kevlar shock cord.',
    motor: 'AeroTech reloadable motor — bought, not printed.',
  })[id] || ({buy: 'Bought hardware — not printed.'})[k];
}
const badgeText = id => id === 'avionics' ? 'sled printed · electronics bought' : MADE[id] === 'print' ? '3D printed' : 'not printed · ' + ({cut: 'cut to size', buy: 'bought', epoxy: 'epoxy'})[MADE[id] || 'buy'];
const stat = k => (R.stats.find(s => s[0] === k) || [0, '—'])[1];

const MOUNT = ['mmt', 'crF', 'ihook', 'crM', 'crA'], EBAY = ['cpl1', 'bulkhead', 'ubolt', 'upper', 'ports', 'avionics'];
const STEPS = [
  {t: 'Sort your parts: what gets printed?', from: 'fade', overview: true,
   text: 'This is the finished rocket colour-coded by how each part is made. Only two parts come off the 3D printer: the nose cone and the avionics sled. The rest is cut cardboard, cut birch plywood, bought hardware, or epoxy. Step through to see the order a real build goes in, including what gets built off the rocket and joined later.',
   tip: 'Orange = printed. Yellow = cut/drilled from stock. Blue = bought. Purple = epoxy.'},
  {t: 'Motor-mount tube', ids: ['mmt'], from: 'fade',
   text: 'The fin-can core is built on the bench, outside the body tube. Cut the 29 mm motor-mount tube to 9½ in (241.3 mm) and sand the ends square. Thrust travels motor → tube → rings and fins → body.',
   tip: 'Dry-fit your motor case in it before anything is glued.'},
  {t: 'Forward ring + I-hook', ids: ['ihook', 'crF'], from: 'fore', d: 200,
   text: 'Pass the I-hook through the solid part of the forward centering ring, off to one side of the motor-tube hole (the motor will sit in the middle), put a nut and washer on each side, and epoxy it. Then epoxy the ring on the motor tube near its forward end. The recovery cord clips to this hook, so this joint takes the parachute shock.',
   tip: 'The eye of the hook faces forward, toward the nose.'},
  {t: 'Mid + aft centering rings', ids: ['crM', 'crA'], from: 'aft', d: 220,
   text: 'Epoxy the mid ring and the aft ring on the motor tube. The fin tabs will sit between these two rings, so use the fin slots you will cut in the body tube as the guide for spacing. Keep both rings square to the tube.',
   tip: 'All three rings are 1/8 in birch plywood (Ø3¼ in, with a Ø1 7/32 in hole). Sand each ring until it fits the tube. Let the epoxy cure before the next step.'},
  {t: 'Fin-can body tube', ids: ['lower'], from: 'fade', focus: [880, 1660],
   text: 'Cut the lower body tube to 11½ in and cut three fin slots, 120° apart, each 7/32 in wide × 4 1/16 in long (per the team drawing, sheet 3). This is the tube the finished mount will go into; for now it just sits beside the mount.',
   tip: 'Mark the slots from the mid and aft ring positions so the tabs land between the rings.'},
  {t: 'Insert the mount into the fin can', ids: [], chips: MOUNT, focus: [900, 1214], unstage: 'mount',
   text: 'Epoxy the outer edge of each ring and push the whole motor mount into the tube from the aft end until the aft ends are flush. Line the three slots up with the space between the mid and aft rings.',
   tip: 'Do a dry run first. Epoxy sets before you can fix a crooked ring.'},
  {t: 'Fins ×3, through-the-wall', ids: ['fins'], from: 'radial', d: 230,
   text: 'Push each birch fin tab through its slot until it butts the motor tube, and epoxy the tab to the tube between the mid and aft rings. Keep the three fins 120° apart and square to the tube while the epoxy tacks. The tab, not the outside fillet, takes the landing loads.',
   tip: 'Round the fin edges, not the root or the tab (per the drawing). A jig that holds the fins at 120° makes this much easier.'},
  {t: 'Epoxy fillets', ids: ['fillets'], from: 'radial', d: 24,
   text: 'Once the fins are tacked in, run epoxy fillets along both sides of every fin root, inside and outside the tube. Mask the tube for neat lines. Let it fully cure before moving on.',
   tip: 'Epoxy is the only "part" here that is made on the spot, with no shape to print or buy.'},
  {t: 'Motor retainer + aft rail button', ids: ['retainer', 'btnA'], from: 'aft', d: 220, s: {btnA: [0, -130]},
   text: 'Epoxy (or JB-Weld) the body of the aluminum 29 mm retainer onto the aft end of the motor tube; its cap screws on over the motor later. Glue a small backing block inside the fin can between fins 2 and 3, then screw the aft rail button into it, 20 mm from the aft end.',
   tip: 'Rail buttons are bought Delrin hardware.'},
  {t: 'Coupler 2 (access joint)', ids: ['cpl2'], from: 'fore', d: 300,
   text: 'Bond coupler 2 half-way into the forward end of the fin can. It stays with the fin can and never separates in flight; the middle tube is screwed onto it next.',
   tip: 'Cut from cardboard coupler stock, 4 in long.'},
  {t: 'Middle tube + forward rail button', ids: ['middle', 'btnF'], from: 'fore', d: 360, s: {btnF: [0, -130]},
   text: 'Slide the recovery-bay tube over the free half of coupler 2 and fasten it with screws (the access joint). Screw the forward rail button through the wall 30 mm from the aft end of this tube, with a backing plate inside. The front of this tube is now open, and that matters for the next steps.',
   tip: 'The access joint lets you reach the recovery bay without un-gluing anything.'},
  {t: 'Shock cord onto the I-hook', ids: ['cord'], from: 'fore', d: 260,
   text: 'Feed the 15 ft Kevlar shock cord in through the open front of the middle tube and clip its aft end to the I-hook quick link. Do this now: once the upper section is joined, you can no longer reach the I-hook. Leave the other end hanging out the front.',
   tip: 'The load path to the fin can is cord → I-hook → centering ring → motor tube and body tube.'},
  {t: 'E-bay: coupler 1 + bulkhead + U-bolt', ids: ['cpl1', 'bulkhead', 'ubolt'], from: 'fade',

$('bPlay').onclick = () => { build.play = !build.play; if (build.play && build.step === STEPS.length - 1) setStep(0); build.playT = 0; renderStepUI(); };
addEventListener('keydown', e => {
  if (!build.on || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { build.play = false; setStep(build.step + 1); }
  else if (e.key === 'ArrowLeft') { build.play = false; setStep(build.step - 1); }
  else if (e.key === 'Escape') exitBuild();
});

// ---------- effects: motor flame, smoke, ejection puff ----------
const fxTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const fx = []; let fxN = 0;
for (let i = 0; i < 220; i++) { const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: fxTex, transparent: true, depthWrite: false, opacity: 0})); sp.visible = false; sp.userData = {life: 0}; world.add(sp); fx.push(sp); }
function emit(pos, vel, life, s0, s1, color, a = 0.5, additive = false) {
  const sp = fx[fxN++ % fx.length], d = sp.userData;
  sp.position.copy(pos); Object.assign(d, {v: vel, life, max: life, s0, s1, a});
  sp.material.color.set(color);
  const bl = additive ? THREE.AdditiveBlending : THREE.NormalBlending; if (sp.material.blending !== bl) { sp.material.blending = bl; sp.material.needsUpdate = true; }
  sp.visible = true;
}
function fxStep(dt) {
  for (const sp of fx) { const d = sp.userData; if (!d.life) continue; d.life -= dt; if (d.life <= 0) { d.life = 0; sp.visible = false; continue; }
    const k = 1 - d.life / d.max; sp.position.addScaledVector(d.v, dt); d.v.multiplyScalar(1 - 1.2 * dt); sp.scale.setScalar(d.s0 + (d.s1 - d.s0) * k); sp.material.opacity = d.a * (1 - k) * Math.min(1, k * 8 + .2); }
}
const flame = new THREE.Group(); flame.visible = false; world.add(flame);
{
  const mk = (r, h, c, o) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 24, 1, true), new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide}));
    m.rotation.z = -Math.PI / 2; m.position.x = h / 2; return m; };
  flame.add(mk(13, 170, 0xff6a1a, .55), mk(8, 120, 0xffc24a, .75), mk(4, 70, 0xffffff, .9)); flame.position.x = L - 4;
}
let burn = null;
$('fireBtn').onclick = () => {
  if (burn) return;
  if (amount > 0.02) { amount = 0; $('explode').value = 0; $('exv').textContent = '0%'; applyOffsets(); }
  burn = {t0: performance.now(), dur: 2300};
};
$('puffBtn').onclick = () => {
  if (build.on) return;
  setMode('eject'); amount = 0; $('explode').value = 0; $('exv').textContent = '0%'; applyOffsets();
  const start = performance.now(), x = R.joints.upper_middle, V = new THREE.Vector3;
  for (let i = 0; i < 70; i++) { const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 300;
    emit(new THREE.Vector3(x + (Math.random() - .5) * 20, Math.cos(a) * RO, Math.sin(a) * RO), V.set((Math.random() - .5) * 160, Math.cos(a) * sp, Math.sin(a) * sp).clone(), 1.5 + Math.random() * .8, 18, 90 + Math.random() * 40, i % 5 ? 0xd6d6d6 : 0xffb066, .55, false); }
  emit(new THREE.Vector3(x, 0, 0), new THREE.Vector3, .35, 40, 260, 0xffd9a0, .9, true);
  anim = t => { const k = Math.min((t - start) / 1500, 1); amount = easeOut(k); $('explode').value = Math.round(amount * 100); $('exv').textContent = $('explode').value + '%'; applyOffsets(); if (k >= 1) anim = null; };
};

// ---------- live parts (subtle idle motion) ----------
let lastCord = 0;
function liveStep(t, dt) {
  const on = $('live').checked, T = t / 1000;
  if (partGroups.swivel) partGroups.swivel.rotation.x = on ? T * 1.1 : 0;                                    // swivel turns freely
  const led = partGroups.avionics?.children.find(m => m.userData.led);
  if (led) { const lit = on && (T % 1) < 0.12 || (on && (T % 1) > 0.25 && (T % 1) < 0.33); led.material.emissive.set(0x2aff6b); led.material.emissiveIntensity = lit ? 2.2 : 0.06; }   // double-blink status LED
  if (chuteCanopy) { const s = on ? 1 + 0.035 * Math.sin(T * 1.7) : 1; chuteCanopy.scale.set(1, s, 2 - s); }       // packed chute breathes
  if (nomexMesh) nomexMesh.rotation.x = Math.PI / 4 + (on ? 0.035 * Math.sin(T * 1.3) : 0);                       // Nomex flutters
  if (on && t - lastCord > 45 && partGroups.cord.visible) {                                                    // shock cord sways
    lastCord = t; const spec = cordSpec(T);
    cordMeshes.forEach((m, i) => { m.geometry.dispose(); m.geometry = tubeGeo(spec[i][0], spec[i][1]); });
  }
  // motor burn
  let jx = 0, jy = 0, jz = 0;
  if (burn) {
    const e = performance.now() - burn.t0, k = e / burn.dur;
    if (k >= 1) { burn = null; flame.visible = false; }
    else {
      const ramp = Math.min(1, e / 150) * (k > .85 ? (1 - k) / .15 : 1);
      flame.visible = true; flame.scale.set(ramp * (0.85 + 0.3 * Math.random()), ramp * (0.9 + 0.2 * Math.random()), ramp * (0.9 + 0.2 * Math.random()));
      jy = (Math.random() - .5) * 1.6 * ramp; jz = (Math.random() - .5) * 1.6 * ramp; jx = (Math.random() - .5) * .8 * ramp;
      const o = new THREE.Vector3(L + 10, 0, 0);
      for (let i = 0; i < 2; i++) emit(o.clone().add(new THREE.Vector3(60 + Math.random() * 40, (Math.random() - .5) * 14, (Math.random() - .5) * 14)),
        new THREE.Vector3(260 + Math.random() * 220, (Math.random() - .5) * 90, (Math.random() - .5) * 90), 1.3, 22, 100, i ? 0xcfcfcf : 0xffa860, .38, false);
    }
  }
  world.position.set(-L / 2 + jx, jy, jz);
  fxStep(dt);
}


// ---------- motor / I-hook callouts ----------
const notes = [];
function noteAt(group, x, y, z, txt, cls) {
  const d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.textContent = txt;
  const o = new CSS2DObject(d); o.position.set(x, y, z); o.visible = false; group.add(o);
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, y > 0 ? Math.min(y, 1) : 0, z), new THREE.Vector3(x, y, z)]), new THREE.LineBasicMaterial({color: 0x9fb0c8, depthTest: false, transparent: true, opacity: .7}));
  l.renderOrder = 9; l.visible = false; group.add(l); notes.push({o, l, group});
  return {o, l};
}
{
  const [a, b] = st('motor'), g = partGroups.motor, h = partGroups.ihook;
  const set = {motor: [], hook: []};
  set.motor.push(noteAt(g, a + 5, RO + 95, 0, 'Forward closure'));
  set.motor.push(noteAt(g, a + 31, RO + 135, 0, 'Ejection charge + delay'));
  set.motor.push(noteAt(g, a + 125, RO + 60, 0, 'Propellant grains'));
  set.motor.push(noteAt(g, b - 14, -RO - 90, 0, 'Nozzle'));
  set.motor.push(noteAt(g, b - 1, -RO - 125, 0, 'Thrust ring'));
  set.hook.push(noteAt(h, st('ihook')[0] + 7, RO + 55, -IHZ, 'I-hook (on forward ring)', 'prn'));
  notes.set = set;
}
function updateNotes() {
  const fin = build.on && STEPS[build.step].final && reveal.motor >= 1;
  const mo = (selected === 'motor' || hovered === 'motor' || fin) && partGroups.motor.visible && amount < 0.02;
  const hk = (mo || selected === 'ihook' || selected === 'crF') && partGroups.ihook.visible && amount < 0.02;
  notes.forEach(n => { const on = (n.group === partGroups.ihook ? hk : mo); n.o.visible = on; n.l.visible = on; });
}

// ---------- per-frame build update ----------
function buildStep(dt, t) {
  let moving = false;
  updateNotes();
  for (const id of Object.keys(partGroups)) {
    const tg = target[id], r = reveal[id];
    const sa = stageAmt[id], stg = stageTgt[id];
    if (sa !== stg) { moving = true; stageAmt[id] = sa + Math.sign(stg - sa) * Math.min(Math.abs(stg - sa), dt / 1.5); }
    if (r !== tg) { moving = true; reveal[id] = r + Math.sign(tg - r) * Math.min(Math.abs(tg - r), dt / 0.95); refreshPart(id); }
  }
  if (build.on) {
    pulse = 0.16 + 0.14 * Math.sin(t / 1000 * 4.2);
    if (build.step > 0) (STEPS[build.step].chips || STEPS[build.step].ids).forEach(id => { if (reveal[id] >= 1) refreshPart(id); });
    printLabels.forEach(o => o.visible = $('tint').checked && partGroups[o.userData.id].visible && reveal[o.userData.id] >= 1);
    if (build.play && !moving) { build.playT += dt; if (build.playT > 5.2) { if (build.step < STEPS.length - 1) setStep(build.step + 1); else { build.play = false; renderStepUI(); } } }
  }
  if (moving || build.on || burn || anim == null) applyOffsets();
}

// start
refreshMaterials(); applyOffsets();
updateOffset(); camera.position.copy(ISO.clone().multiplyScalar(fitDist() * 1.12)); controls.target.set(0, 0, 0);
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
let lastT = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
  buildStep(dt, t); liveStep(t, dt);
  if (tween) {
    const k = Math.min((performance.now() - tween.t0) / tween.ms, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.c0, tween.c1, e);
    if (k >= 1) tween = null;
  }
  if (anim) anim(t);
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
});
</script>
